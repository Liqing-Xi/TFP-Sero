name: TFABS

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # CUDA / PyTorch
  - pytorch=2.0.0
  - cudatoolkit=11.8
  - cudnn=8.9

  # Core scientific stack
  - numpy=1.24.3
  - pandas=2.3.0
  - scipy=1.15.2
  - scikit-learn=1.6.1
  - joblib=1.4.2
  - numexpr=2.10.1
  - bottleneck=1.4.2

  # Deep learning / graph learning
  - pytorch_geometric=2.6.1
  - pytorch_scatter=2.1.2

  # ML packages
  - xgboost=3.0.2
  - lightgbm
  - imbalanced-learn=0.12.3
  - optuna=4.4.0

  # Utilities
  - tqdm=4.67.1
  - requests=2.32.3
  - pyyaml=6.0.2
  - networkx=3.4.2
  - h5py=3.12.1
  - sqlalchemy=2.0.37
  - protobuf=4.21.12
  - rich=13.9.4

  # Bioinformatics
  - biopython

  # Build tools
  - pip
  - setuptools
  - wheel

  - pip:
      - fair-esm==2.0.0
      - transformers==4.48.1
      - accelerate==1.6.0
      - peft==0.15.1
      - tokenizers==0.21.1
      - safetensors==0.5.3
      - huggingface-hub==0.30.1
      - einops==0.8.1

      - dgl==1.1.2
      - torchdata==0.6.1
      - torchtext==0.15.2

      - biotite==0.41.2

      - matplotlib==3.10.1
      - seaborn==0.13.2

      - flask==3.1.1

      - filelock
      - fsspec
      - regex
      - sympy
      - psutil